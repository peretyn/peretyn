name: peretyn

services:
  postgres:
    image: postgres:16-alpine
    container_name: peretyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peretyn
      POSTGRES_PASSWORD: peretyn_dev_password
      POSTGRES_DB: peretyn
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peretyn -d peretyn']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: peretyn-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8025/livez']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
