name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/runtime/go.mod
          cache-dependency-path: |
            services/runtime/go.sum
            packages/go-cli/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Codegen drift
        run: pnpm codegen:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Go vet
        run: pnpm go:vet

      - name: Test
        run: pnpm test

      - name: Integration tests (Postgres)
        run: pnpm go:test:integration

  installer:
    name: Installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERETYN_DIR: ${{ github.workspace }}/../peretyn-install
      PERETYN_DOMAIN: localhost
      PERETYN_ADMIN_EMAIL: admin@example.com
      PERETYN_ADMIN_NAME: Admin
      PERETYN_RESEND_API_KEY: ''

    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck deploy/install.sh

      - name: Install unattended
        run: sh deploy/install.sh </dev/null | tee install.log

      - name: Runtime answers through Caddy
        run: test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/v1/check)" = 401

      - name: Dashboard answers through Caddy
        run: test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = 307

      - name: Admin signs in with the printed password
        run: |
          password=$(sed -n 's/^Password: //p' install.log)
          echo "::add-mask::$password"
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: https://localhost' \
            -d "{\"email\":\"$PERETYN_ADMIN_EMAIL\",\"password\":\"$password\"}" https://localhost/api/auth/sign-in/email)" = 200

      - name: Running again upgrades and keeps the secrets
        run: |
          before=$(grep -v '^PERETYN_TAG=' "$PERETYN_DIR/.env" | sha256sum)
          sh deploy/install.sh </dev/null
          after=$(grep -v '^PERETYN_TAG=' "$PERETYN_DIR/.env" | sha256sum)
          test "$before" = "$after"

      - name: Collect stack logs
        if: always()
        run: docker compose --project-directory "$PERETYN_DIR" logs --no-color > stack.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-stack-logs
          path: stack.log
